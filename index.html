<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#FFF3DC" />
  <title>Jhanav's Math Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-paper: #FFF3DC;
  --bg-card: #FFFAF0;
  --ink: #2A1B0A;
  --ink-soft: #6A4B28;
  --success: #4AD66D;
  --success-deep: #1F8A3E;
  --gentle-no: #FF7A40;
  --star: #FFC83A;
  --star-glow: #FFF1A8;
  --lock: #A89878;

  --world-primary: #FFB933;
  --world-accent: #FF7A40;
  --world-sky: #7DD2F0;
  --world-ground: #4AAE3F;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;
  --s-9: 96px; --s-10: 128px; --s-11: 160px;

  --r-sm: 12px; --r-md: 20px; --r-lg: 32px; --r-xl: 48px; --r-pill: 9999px;

  --sh-1: 0 3px 0 #C8985A, 0 4px 10px rgba(120,70,20,.18);
  --sh-2: 0 6px 0 #B07A40, 0 8px 18px rgba(120,70,20,.24);
  --sh-3: 0 8px 0 #B07A40, 0 14px 26px rgba(120,70,20,.28);
  --sh-pressed: 0 2px 0 #B07A40, 0 3px 6px rgba(120,70,20,.2);

  --ease-pop: cubic-bezier(0.34, 1.6, 0.5, 1);
  --ease-soft: cubic-bezier(0.45, 0.05, 0.25, 1);
  --ease-snap: cubic-bezier(0.25, 0.9, 0.3, 1.4);
  --ease-elastic: cubic-bezier(0.7, -0.5, 0.3, 1.5);
  --ease-arc: cubic-bezier(0.4, 0, 0.6, 1);
}

#stage[data-world="add"]  { --world-primary:#FFB933; --world-accent:#FF7A40; --world-sky:#7DD2F0; --world-ground:#4AAE3F; }
#stage[data-world="sub"]  { --world-primary:#3DC5C5; --world-accent:#4A9EFF; --world-sky:#A8E5E5; --world-ground:#5FAF9A; }
#stage[data-world="mult"] { --world-primary:#E89A2A; --world-accent:#7AB344; --world-sky:#F8D27A; --world-ground:#8A6A2E; }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--bg-paper); color: var(--ink);
  font-family: 'Nunito', 'Avenir Next', system-ui, sans-serif;
  font-feature-settings: "tnum" 1, "lnum" 1;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#viewport {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative;
  width: 1280px; height: 800px;
  transform-origin: center center;
  background: var(--world-sky);
  overflow: hidden;
  touch-action: none;
}

.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
.display { font-family: 'Lilita One', 'Bungee', system-ui; font-weight: 400; }

.tile {
  width: 96px; height: 96px;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 4px solid var(--ink);
  box-shadow: var(--sh-2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif;
  font-weight: 700;
  font-size: 64px; color: var(--ink);
  cursor: grab; user-select: none;
  transition: transform .12s var(--ease-pop), box-shadow .12s var(--ease-pop);
  position: relative;
  touch-action: none;
}
.tile.dragging {
  transform: scale(1.15) translateY(-8px);
  box-shadow: var(--sh-3);
  z-index: 200; cursor: grabbing;
  transition: none;
}
.tile.dim     { opacity: .3; transform: scale(.94); pointer-events: auto; }
.tile.hint-dim{ opacity: .18; transform: scale(.92); }
.tile.hint-target { animation: hintPulse 2s var(--ease-soft) infinite; }
@keyframes hintPulse {
  0%,100% { transform: scale(1); box-shadow: 0 0 0 0 var(--star-glow); }
  50%     { transform: scale(1.05); box-shadow: 0 0 24px 8px var(--star-glow); }
}

.slot {
  width: 100px; height: 120px;
  border-radius: var(--r-md);
  border: 4px dashed var(--ink-soft);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif;
  font-weight: 700;
  font-size: 96px; color: var(--ink);
  position: relative;
}
.slot.inactive  { opacity: .5; }
.slot.active    { border-style: solid; border-color: var(--world-primary); animation: slotPulse 1.8s var(--ease-soft) infinite; }
.slot.filled    { border-style: solid; border-color: var(--ink); animation: none; }
.slot.flash-no  { border-color: var(--gentle-no); animation: slotShake .3s var(--ease-elastic); }
@keyframes slotPulse {
  0%   { box-shadow: 0 0 0 0 var(--world-primary); }
  60%  { box-shadow: 0 0 0 16px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@keyframes slotShake {
  0%,100% { transform: rotate(0); }
  25% { transform: rotate(5deg); }
  50% { transform: rotate(-5deg); }
  75% { transform: rotate(3deg); }
}
@keyframes slotCorrectFlash {
  0%   { box-shadow: 0 0 0 0 var(--success), 0 0 0 0 var(--star-glow);
         border-color: var(--success-deep); }
  40%  { box-shadow: 0 0 0 18px rgba(74, 214, 109, 0.55), 0 0 28px 12px rgba(255, 241, 168, 0.8);
         border-color: var(--success-deep); }
  100% { box-shadow: 0 0 0 32px rgba(74, 214, 109, 0), 0 0 36px 18px rgba(255, 241, 168, 0);
         border-color: var(--ink); }
}
@keyframes slotDigitPunch {
  0%   { transform: scale(0.6); }
  55%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}
.slot.filled.just-filled {
  animation: slotCorrectFlash 0.7s var(--ease-pop);
}
.slot.filled.just-filled {
  /* Punch-in the digit text */
  display: inline-flex;
}
.slot.filled.just-filled::before {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none;
}
.slot.just-filled {
  animation: slotCorrectFlash 0.7s var(--ease-pop), slotDigitPunch 0.4s var(--ease-pop);
}

/* Sparkle particles spawned by correctBurst() */
.spark-particle {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 400;
  box-shadow: 0 0 8px currentColor;
  transform: translate(-50%, -50%);
}

.mascot-sparkle {
  position: absolute;
  width: 28px; height: 28px;
  pointer-events: none;
  z-index: 350;
  background: var(--star);
  /* CSS-only 4-point star using clip-path */
  clip-path: polygon(50% 0%, 60% 38%, 100% 50%, 60% 62%, 50% 100%, 40% 62%, 0% 50%, 40% 38%);
  filter: drop-shadow(0 0 8px var(--star-glow));
}
.mascot-sparkle:nth-child(3n) { background: var(--world-primary); }
.mascot-sparkle:nth-child(3n+1) { background: var(--success); }

.block-host {
  width: 96px; height: 96px;
  display: inline-block;
  cursor: grab;
  transition: transform .2s var(--ease-pop);
  filter: drop-shadow(0 4px 0 rgba(120,70,20,0.25));
  touch-action: none;
}
.block-host.idle-wobble { animation: blockWobble 2s ease-in-out infinite; }
@keyframes blockWobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.block-host.untapped { opacity: .55; filter: none; }
.block-host.tapped   { opacity: 1; animation: blockPop .35s var(--ease-pop); }
.block-host.dragging { transform: scale(1.15); animation: none; z-index: 200; cursor: grabbing; }
.block-host.in-group { transform: scale(1); animation: none; }
@keyframes blockPop {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.4); }
  100% { transform: scale(1.05); }
}

.block-host .glow circle { transition: opacity .35s var(--ease-pop); }
.block-host.tapped .glow circle { opacity: .7; }

/* Task 16 count-badge first pass — superseded by Task 19 definition below */

/* Task 16 group-tray styles superseded by Task 29 — removed to avoid cascade conflicts */

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 12px;
  min-width: 280px; height: 110px;
  border-radius: var(--r-pill);
  border: 4px solid var(--ink);
  background: var(--world-primary); color: var(--ink);
  font-family: 'Lilita One', system-ui; font-size: 36px;
  cursor: pointer; user-select: none;
  box-shadow: var(--sh-3);
  transition: transform .08s var(--ease-pop), box-shadow .08s var(--ease-pop), filter .15s;
  padding: 0 32px;
}
.btn:active { transform: translateY(6px); box-shadow: var(--sh-pressed); }
.btn.pill   { min-width: 480px; height: 120px; font-size: 56px; }
.btn.ghost  { background: var(--bg-card); }
.btn.success{ background: var(--success); color: #fff; }
.btn:disabled, .btn.disabled {
  opacity: .55; cursor: not-allowed; box-shadow: none;
  background: var(--ink-soft);
}

.star-meter { display: inline-flex; gap: 8px; align-items: center; }
.star-meter .star { width: 32px; height: 32px; }
.star-meter.big .star { width: 160px; height: 160px; }
.star-meter .star.empty path { opacity: .25; }
.star-meter .star.earned {
  filter: drop-shadow(0 0 12px var(--star-glow));
  animation: starReveal .5s var(--ease-pop);
}
.star-meter .star.earned path { fill: var(--star); opacity: 1; }
@keyframes starReveal {
  0%   { transform: translateY(-80px) scale(0); opacity: 0; }
  60%  { transform: translateY(0) scale(1.3); opacity: 1; }
  100% { transform: translateY(0) scale(1); }
}

/* ===== TASK 17: Carry & Borrow Chip Styles ===== */
.carry-chip, .borrow-chip {
  position: fixed;
  width: 60px; height: 60px;
  border-radius: var(--r-md);
  background: var(--world-primary);
  border: 3px solid var(--ink);
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif; font-weight: 700; font-size: 40px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  pointer-events: none;
  z-index: 500;
}
.borrow-chip { background: var(--world-accent); }
.carry-slot {
  position: absolute; width: 60px; height: 60px;
  border-radius: var(--r-md);
  border: 3px dashed var(--ink-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif; font-weight: 700; font-size: 40px;
  color: var(--ink);
  opacity: 0;
  transition: opacity .3s var(--ease-pop);
  /* left/top set inline by JS per problem — no hardcoded position here */
}
.carry-slot.filled { opacity: 1; border-style: solid; }

/* ===== TASK 18: Borrow Animation Styles ===== */
.strike {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 6;
}
.strike svg { width: 100%; height: 100%; display: block; overflow: visible; }
.strike line {
  stroke-dasharray: 120;
  stroke-dashoffset: 120;
  animation: strikeDraw 1.3s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
}
@keyframes strikeDraw { to { stroke-dashoffset: 0; } }

.borrow-plus {
  position: fixed;
  width: 36px; height: 36px;
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif;
  font-weight: 700;
  font-size: 44px;
  line-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  pointer-events: none;
  z-index: 500;
}
.borrow-replacement {
  position: absolute;
  width: 60px; height: 60px;
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif;
  font-weight: 700;
  font-size: 56px; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}

/* ===== TASK 19: Block Styles ===== */
.count-badge {
  position: absolute;
  top: -8px; right: -8px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--gentle-no);
  color: white;
  font-family: 'Lilita One', system-ui;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transform: scale(0);
  transition: all .2s var(--ease-pop);
}
.count-badge.show { opacity: 1; transform: scale(1); }

.block.idle-wobble {
  animation: blockWobble 1.5s ease-in-out infinite;
}
@keyframes blockWobble {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-2deg); }
  75% { transform: rotate(2deg); }
}

/* ===== TASK 21: Mascot Animations ===== */
.mascot { display: block; }
.mascot.idle { animation: mascotBreath 4s var(--ease-soft) infinite; }
.mascot.idle .eye-l circle:first-child,
.mascot.idle .eye-r circle:first-child { animation: mascotBlink 4s steps(1) infinite; }
.mascot.celebrate { animation: mascotCelebrate .8s var(--ease-pop) 3; }
.mascot.celebrate .wing-l, .mascot.celebrate .wing-r { animation: wingFlap .8s ease-in-out 3; }

@keyframes mascotBreath { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.015); } }
@keyframes mascotBlink  { 0%,53%,57%,100% { opacity: 1; } 54%,56% { opacity: .1; } }
@keyframes mascotCelebrate {
  0%   { transform: translateY(0); }
  25%  { transform: translateY(-12px) rotate(-3deg); }
  50%  { transform: translateY(0); }
  75%  { transform: translateY(-8px) rotate(3deg); }
  100% { transform: translateY(0); }
}
@keyframes wingFlap {
  0%,100% { transform: rotate(0); }
  50% { transform: rotate(-20deg); }
}

/* ===== Expression presets (CSS-only, all mascots) ===== */
.mascot .eye-state,
.mascot .mouth-state,
.mascot .brow-state { display: none; }

.mascot.idle .eye-state.idle,
.mascot.idle .mouth-state.idle,
.mascot.idle .brow-state.idle { display: inline; }

.mascot.happy .eye-state.idle,
.mascot.happy .brow-state.idle { display: inline; }
.mascot.happy .mouth-state.happy { display: inline; }

.mascot.super-happy .eye-state.super-happy,
.mascot.super-happy .brow-state.up,
.mascot.super-happy .mouth-state.super-happy { display: inline; }

.mascot.dizzy .eye-state.dizzy,
.mascot.dizzy .brow-state.idle,
.mascot.dizzy .mouth-state.dizzy { display: inline; }

.mascot.surprised .eye-state.surprised,
.mascot.surprised .brow-state.up,
.mascot.surprised .mouth-state.surprised { display: inline; }

/* ===== Transform-origins (new 200×200 viewBox geometry) ===== */
.mascot .head    { transform-origin: 100px 100px; }
.mascot .tail    { transform-origin: 100px 150px; }
.mascot .wing-l  { transform-origin:  65px 110px; }
.mascot .wing-r  { transform-origin: 135px 110px; }
.mascot .arm-l   { transform-origin:  62px 122px; }
.mascot .arm-r   { transform-origin: 138px 122px; }
.mascot .ear-l   { transform-origin:  80px  84px; }
.mascot .ear-r   { transform-origin: 120px  84px; }

/* ===== TASK 22: Confetti Styles ===== */
.confetti-particle { position: absolute; pointer-events: none; }
.confetti-particle svg { width: 20px; height: 20px; }

/* ===== TASK 23: Node Unlock Styles ===== */
.level-node.unlocking { animation: nodeShake .4s var(--ease-elastic); }
@keyframes nodeShake { 0%,100% { transform: scale(1); } 25% { transform: scale(1.06) rotate(6deg); } 75% { transform: scale(1.06) rotate(-6deg); } }

/* ===== TASK 24: Splash Screen ===== */
#screen-splash {
  background: linear-gradient(to bottom, var(--world-sky) 0%, var(--world-sky) 60%, var(--world-ground) 60%, var(--world-ground) 100%);
}
.splash-title {
  position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
  font-size: 88px; line-height: 1; margin: 0;
  color: var(--ink);
  text-shadow: 0 4px 0 var(--star);
  letter-spacing: 2px;
  text-align: center;
}
.splash-mascot {
  position: absolute; top: 220px; left: 50%; transform: translateX(-50%);
  width: 340px; height: 340px;
}
.splash-mascot svg { width: 100%; height: 100%; }
.splash-play {
  position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
  animation: playPulse 2s var(--ease-soft) infinite;
}
@keyframes playPulse {
  0%,100% { box-shadow: var(--sh-3), 0 0 0 0 var(--world-primary); }
  50%     { box-shadow: var(--sh-3), 0 0 0 18px transparent; }
}
.cog-corner { position: absolute; top: 32px; right: 32px; width: 80px; height: 80px; cursor: pointer; }
.cog-corner svg { width: 100%; height: 100%; }

/* ===== TASK 25: World Map Screen ===== */
#screen-map {
  background: linear-gradient(to bottom, #FFF3DC 0%, #F7E2B0 100%);
  padding: 80px 24px 24px;
}
.home-btn {
  position: absolute; top: 32px; left: 32px;
  width: 80px; height: 80px;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 4px solid var(--ink);
  box-shadow: var(--sh-1);
  cursor: pointer;
}
.home-btn svg { width: 100%; height: 100%; padding: 12px; }

.star-meter.total {
  position: absolute; top: 40px; right: 32px;
  font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 28px;
  display: flex; align-items: center; gap: 8px;
}
.star-meter.total svg.star { width: 32px; height: 32px; vertical-align: middle; }

.world-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 24px; height: 100%; padding-top: 24px;
}
.world-panel {
  background: var(--bg-card);
  border: 5px solid var(--ink);
  border-radius: var(--r-lg);
  padding: 16px; position: relative; overflow: hidden;
}
.world-title { text-align: center; font-size: 28px; margin: 0 0 12px; }
.world-add  .world-title { color: #B07020; }
.world-sub  .world-title { color: #2C8585; }
.world-mult .world-title { color: #B26818; }

.level-path {
  display: grid; grid-template-columns: repeat(2, 100px);
  justify-content: center; align-content: space-around;
  gap: 24px 32px; height: calc(100% - 40px);
}
.level-node {
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 5px solid var(--ink);
  background: var(--world-primary);
  color: #fff;
  font-family: 'Lilita One', system-ui; font-size: 48px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  box-shadow: var(--sh-1);
}
.level-node.locked { background: var(--lock); cursor: default; }
.level-node.locked svg { width: 56px; height: 56px; }
.level-node.unlocked { animation: nodePulse 1.8s var(--ease-soft) infinite; }
.level-node.stars-1, .level-node.stars-2, .level-node.stars-3 { animation: none; }
@keyframes nodePulse {
  0%,100% { box-shadow: var(--sh-1), 0 0 0 0 var(--world-primary); }
  50%     { box-shadow: var(--sh-1), 0 0 0 16px transparent; }
}
.node-ribbon {
  position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px;
  background: var(--ink); padding: 2px 6px; border-radius: var(--r-pill);
}
.node-ribbon svg { width: 18px; height: 18px; }

/* ===== TASK 26: Addition Level Screen ===== */
#screen-add, #screen-sub {
  background: var(--world-sky);
  padding: 0;
}
.topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 72px;
  display: flex; align-items: center; gap: 24px;
  padding: 16px 32px;
}
.topbar .star-meter.run { margin-left: auto; }
.home-btn.small {
  position: static;   /* opt out of absolute positioning from base .home-btn */
  top: auto;
  left: auto;
  width: 56px;
  height: 56px;
  padding: 0;
}
.home-btn.small svg { width: 100%; height: 100%; }
.progress-dots { display: flex; gap: 8px; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: var(--bg-card); border: 3px solid var(--ink); }
.dot.current { background: var(--world-primary); }
.dot.filled  { background: var(--success); }
.star-meter.run { font-size: 24px; font-family: 'Nunito', sans-serif; font-weight: 900; }

.worksheet {
  position: absolute; left: 380px; top: 100px; width: 520px; height: 540px;
  display: grid; grid-template-rows: auto auto auto 6px auto;
  gap: 16px;
  justify-content: center; align-content: start;
  font-family: 'Fredoka', 'Lilita One', system-ui, sans-serif;
  font-weight: 700;
}
.worksheet .row { display: flex; gap: 16px; justify-content: flex-end; }
.worksheet .row.top { position: relative; }
.worksheet .row.bot .op { font-size: 96px; line-height: 120px; width: 60px; text-align: center; }
.worksheet .cell { width: 100px; height: 120px; font-size: 96px; line-height: 120px; text-align: center; position: relative; }
.worksheet .cell.empty { opacity: 0; }
.worksheet .line { background: var(--ink); height: 6px; border-radius: 3px; margin: 0 0 0 76px; max-width: 232px; }
.worksheet .row.ans { gap: 16px; justify-content: flex-end; }
.carry-slot.hidden { display: none; }

/* Compound tiles (10-18): same box as single digits, smaller font to fit 2 chars */
.tile.compound {
  width: 96px;
  height: 96px;
  font-size: 56px;
}

/* Two-row tray when compound tiles are present */
.digit-tray.two-row {

            const gc = groupContents[gIdx];
            if (gc.filled >= gc.needed) {
              sourceEl.classList.remove("dragging");
              return tileBounceBack(sourceEl, origin, parentInfo);
            }
            const tray = target.el;
            const ghosts = tray.querySelectorAll(".ghost");
            const slot = ghosts[gc.filled];
            sourceEl.classList.remove("dragging", "idle-wobble");
            sourceEl.classList.add("in-group");
            sourceEl.style.position = "absolute";
            sourceEl.style.left = `${slot.offsetLeft}px`;
            sourceEl.style.top = `${slot.offsetTop}px`;
            tray.appendChild(sourceEl);
            gc.filled++;
            tray.querySelector(".count-chip").textContent = `${gc.filled} / ${gc.needed}`;
            sfx.tilePickup();
            if (gc.filled === gc.needed) {
              tray.classList.add("full");
              tray.querySelector(".count-chip").textContent = `\u2605 ${gc.needed}`;
              sfx.trayFull();
            }
            if (groupContents.every((g) => g.filled === g.needed)) {
              setTimeout(showAnswerPhase, 800);
            }
          } else if (payload.kind === "digit") {
            if (!target || !String(target.id || "").startsWith("slot-")) return tileBounceBack(sourceEl, origin, parentInfo);
            const slotIndex = parseInt(String(target.id).replace("slot-", ""), 10);
            const next = dropDigit(state2, payload.digit, slotIndex);
            if (!next.lastDropCorrect) {
              totalWrong++;
              state2 = next;
              trayWrongOnCurrentSlot++;
              await tileBounceBack(sourceEl, origin, parentInfo);
              target.el.classList.add("flash-no");
              setTimeout(() => target.el.classList.remove("flash-no"), 200);
              if (trayWrongOnCurrentSlot >= 2) applyHint();
              return;
            }
            state2 = next;
            await tileSnapIn(sourceEl, target.el);
            if (isComplete(state2)) {
              idx++;
              renderProgressDots();
              if (idx >= problems.length) {
                router2.go("complete", { world, level, wrongCount: totalWrong });
              } else {
                sfx.transition();
                setTimeout(renderProblem, 500);
              }
            } else {
              sec.querySelectorAll(".slot").forEach((el) => {
                const i = parseInt(el.dataset.index, 10);
                el.classList.remove("active", "inactive");
                if (i === state2.activeIndex) el.classList.add("active");
                else if (!el.classList.contains("filled")) el.classList.add("inactive");
              });
              trayWrongOnCurrentSlot = 0;
              syncTrayDim();
            }
          }
        }
      });
    }
    function syncTrayDim() {
      sec.querySelectorAll(".tile").forEach((tile) => {
        tile.classList.remove("dim", "hint-dim", "hint-target");
      });
      if (state2.slots.length === 2 && state2.activeIndex === 0) {
        const expected = state2.expected[state2.activeIndex];
        sec.querySelectorAll(".tile").forEach((tile) => {
          if (parseInt(tile.dataset.digit, 10) !== expected) tile.classList.add("dim");
        });
      }
    }
    function applyHint() {
      const expected = state2.expected[state2.activeIndex];
      sec.querySelectorAll(".tile").forEach((tile) => {
        if (parseInt(tile.dataset.digit, 10) === expected) {
          tile.classList.remove("dim");
          tile.classList.add("hint-target");
        } else {
          tile.classList.add("hint-dim");
        }
      });
      sfx.hintHmm();
    }
    function showAnswerPhase() {
      groupRow.animate(
        [{ opacity: 1 }, { opacity: 0.4 }],
        { duration: 400, fill: "forwards" }
      );
      ansSlotHost.textContent = "";
      if (state2.slots.length === 2) {
        const slot0 = document.createElement("div");
        slot0.className = "slot inactive";
        slot0.dataset.index = "0";
        ansSlotHost.appendChild(slot0);
      }
      const slotLast = document.createElement("div");
      slotLast.className = "slot active";
      slotLast.dataset.index = String(state2.slots.length - 1);
      ansSlotHost.appendChild(slotLast);
      ansHost.classList.remove("hidden");
      digitTray.classList.remove("hidden");
      digitTray.textContent = "";
      for (let n = 0; n <= 9; n++) {
        const t = document.createElement("div");
        t.className = "tile";
        t.dataset.digit = String(n);
        t.textContent = String(n);
        t.onpointerdown = (e) => dragMgr.start(e, t, { kind: "digit", digit: n });
        digitTray.appendChild(t);
      }
      syncTrayDim();
    }
    stage2.appendChild(sec);
    return () => sec.remove();
  }

  // src/screens/complete.js
  function mount7(stage2, ctx2, router2) {
    const { world, level, wrongCount } = ctx2;
    stage2.dataset.world = world;
    const stars = starsFor(wrongCount);
    recordStars(localStorage, world, level, stars);
    const sec = document.createElement("section");
    sec.className = "screen active";
    sec.id = "screen-complete";
    const title = document.createElement("h1");
    title.className = "complete-title display";
    title.textContent = "LEVEL CLEAR!";
    sec.appendChild(title);
    const meter = document.createElement("div");
    meter.className = "star-meter big";
    meter.insertAdjacentHTML("beforeend", star(false));
    meter.insertAdjacentHTML("beforeend", star(false));
    meter.insertAdjacentHTML("beforeend", star(false));
    sec.appendChild(meter);
    const mascotEl = document.createElement("div");
    mascotEl.className = "complete-mascot";
    const m = world === "add" ? banji : world === "sub" ? mo : pip;
    mascotEl.insertAdjacentHTML("beforeend", m("idle"));
    sec.appendChild(mascotEl);
    const buttons = document.createElement("div");
    buttons.className = "complete-buttons";
    const againBtn = document.createElement("button");
    againBtn.className = "btn ghost";
    againBtn.dataset.act = "again";
    againBtn.textContent = "\u21BB AGAIN";
    const nextBtn = document.createElement("button");
    nextBtn.className = "btn success";
    nextBtn.dataset.act = "next";
    nextBtn.textContent = "\u25B6 NEXT";
    if (level >= 6) nextBtn.classList.add("disabled");
    const mapBtn = document.createElement("button");
    mapBtn.className = "btn ghost";
    mapBtn.dataset.act = "map";
    mapBtn.textContent = "\u{1F3E0} MAP";
    buttons.appendChild(againBtn);
    buttons.appendChild(nextBtn);
    buttons.appendChild(mapBtn);
    buttons.addEventListener("pointerup", (e) => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "again") {
        sfx.transition();
        router2.go("level", { world, level });
      } else if (act === "next" && level < 6) {
        sfx.transition();
        router2.go("level", { world, level: level + 1 });
      } else if (act === "map") {
        sfx.transition();
        router2.go("map");
      }
    });
    sec.appendChild(buttons);
    const confettiHost = document.createElement("div");
    confettiHost.className = "confetti-host";
    sec.appendChild(confettiHost);
    stage2.appendChild(sec);
    burstConfetti(confettiHost, 80);
    sfx.levelComplete();
    const starEls = sec.querySelectorAll(".star-meter .star");
    starEls.forEach((s) => s.classList.remove("filled", "earned"));
    revealStars(starEls, stars).then(() => {
      const svg = mascotEl.querySelector("svg");
      if (svg) mascotCelebrate(svg);
    });
    return () => sec.remove();
  }

  // src/screens/settings.js
  function mount8(stage2, state2, router2) {
    const sec = document.createElement("section");
    sec.className = "screen active";
    sec.id = "screen-settings";
    const card = document.createElement("div");
    card.className = "parent-gate-card";
    const h2 = document.createElement("h2");
    h2.className = "display";
    h2.textContent = "PARENTS ONLY";
    const p = document.createElement("p");
    const q = document.createElement("span");
    q.id = "pg-q";
    p.append("Tap the answer to ", q);
    const btnHost = document.createElement("div");
    btnHost.className = "pg-buttons";
    const err = document.createElement("div");
    err.className = "pg-error hidden";
    err.textContent = "Try again";
    card.append(h2, p, btnHost, err);
    sec.appendChild(card);
    const a = 2 + Math.floor(Math.random() * 7);
    const b = 1 + Math.floor(Math.random() * 6);
    const c = 1 + Math.floor(Math.random() * 5);
    const answer = a + b + c;
    q.textContent = `${a} + ${b} + ${c} = ?`;
    const options = /* @__PURE__ */ new Set([answer]);
    while (options.size < 4) {
      const candidate = answer + (Math.floor(Math.random() * 7) - 3);
      if (candidate > 0 && candidate !== answer) options.add(candidate);
    }
    [...options].sort(() => Math.random() - 0.5).forEach((n) => {
      const b2 = document.createElement("button");
      b2.className = "btn ghost";
      b2.textContent = String(n);
      b2.addEventListener("pointerup", () => {
        if (n === answer) showSettings();
        else {
          err.classList.remove("hidden");
          b2.classList.add("disabled");
        }
      });
      btnHost.appendChild(b2);
    });
    function showSettings() {
      sec.innerHTML = "";
      const c2 = document.createElement("div");
      c2.className = "settings-card";
      const h = document.createElement("h2");
      h.className = "display";
      h.textContent = "SETTINGS";
      const soundBtn = document.createElement("button");
      soundBtn.className = "btn";
      soundBtn.textContent = `SOUND: ${isEnabled() ? "ON" : "OFF"}`;
      soundBtn.addEventListener("pointerup", () => {
        setEnabled(!isEnabled());
        soundBtn.textContent = `SOUND: ${isEnabled() ? "ON" : "OFF"}`;
      });
      const resetBtn = document.createElement("button");
      resetBtn.className = "btn ghost";
      resetBtn.textContent = "RESET PROGRESS";
      resetBtn.addEventListener("pointerup", () => {
        if (confirm("Reset all progress? This cannot be undone.")) {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("bm.stars.")) localStorage.removeItem(k);
          }
          router2.go("splash");
        }
      });
      const closeBtn = document.createElement("button");
      closeBtn.className = "btn ghost";
      closeBtn.textContent = "CLOSE";
      closeBtn.addEventListener("pointerup", () => router2.go("splash"));
      c2.append(h, soundBtn, resetBtn, closeBtn);
      sec.appendChild(c2);
    }
    stage2.appendChild(sec);
    return () => sec.remove();
  }

  // src/game.js
  var stage = document.getElementById("stage");
  var viewport = document.getElementById("viewport");
  function fitStage() {
    const scale = Math.min(viewport.clientWidth / 1280, viewport.clientHeight / 800);
    stage.style.transform = `scale(${scale})`;
  }
  window.addEventListener("resize", fitStage);
  window.addEventListener("orientationchange", fitStage);
  fitStage();
  var state = { progress: loadProgress() };
  var router = {
    current: null,
    go(name, ctx2 = {}) {
      if (this.current) this.current();
      let unmount;
      switch (name) {
        case "splash":
          unmount = mount(stage, state, this);
          break;
        case "map":
          state.progress = loadProgress();
          unmount = mount2(stage, state, this);
          break;
        case "level":
          if (ctx2.world === "add") unmount = mount3(stage, ctx2, this);
          else if (ctx2.world === "sub") unmount = mount4(stage, ctx2, this);
          else if (ctx2.world === "mult" && ctx2.level <= 3) unmount = mount5(stage, ctx2, this);
          else if (ctx2.world === "mult" && ctx2.level >= 4) unmount = mount6(stage, ctx2, this);
          break;
        case "complete":
          unmount = mount7(stage, ctx2, this);
          break;
        case "settings":
          unmount = mount8(stage, state, this);
          break;
        default:
          console.warn("Unknown route:", name);
      }
      this.current = unmount;
    }
  };
  router.go("splash");
  window.__router = router;
})();
